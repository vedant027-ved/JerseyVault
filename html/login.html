<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register | JerseyHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-banner">
  <div class="container">
    <h1>My Account</h1>
    <div class="crumb"><a href="index.html">Home</a> / <span>Login / Register</span></div>
  </div>
</section>

<section class="section">
  <div class="container narrow">
    <div class="tab-row">
      <button class="tab-btn active" id="tabLogin">Login</button>
      <button class="tab-btn" id="tabRegister">Register</button>
    </div>

    <form class="form-card" id="loginForm">
      <div class="form-field"><label>Email Address</label><input type="email" required></div>
      <div class="form-field"><label>Password</label><input type="password" required></div>
      <p class="hint" style="margin-bottom:18px;"><a href="#" style="color:var(--red);">Forgot your password?</a></p>
      <button type="submit" class="btn btn-primary btn-full">Login</button>
      <p class="hint text-center" style="margin-top:16px;">New to JerseyHub? <a href="#" id="switchToRegister" style="color:var(--red);">Create an account</a></p>
    </form>

    <form class="form-card" id="registerForm" style="display:none;">
      <div class="form-row">
        <div class="form-field"><label>First Name</label><input type="text" required></div>
        <div class="form-field"><label>Last Name</label><input type="text" required></div>
      </div>
      <div class="form-field"><label>Email Address</label><input type="email" required></div>
      <div class="form-field"><label>Mobile Number</label><input type="tel" pattern="[0-9]{10}" maxlength="10" required></div>
      <div class="form-field"><label>Password</label><input type="password" required></div>
      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      <p class="hint text-center" style="margin-top:16px;">Already have an account? <a href="#" id="switchToLogin" style="color:var(--red);">Login</a></p>
    </form>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/jersey.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
mountLayout('My Account');

const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');

function showLogin(){ tabLogin.classList.add('active'); tabRegister.classList.remove('active'); loginForm.style.display='block'; registerForm.style.display='none'; }
function showRegister(){ tabRegister.classList.add('active'); tabLogin.classList.remove('active'); registerForm.style.display='block'; loginForm.style.display='none'; }

tabLogin.addEventListener('click', showLogin);
tabRegister.addEventListener('click', showRegister);
document.getElementById('switchToRegister').addEventListener('click', (e)=>{e.preventDefault();showRegister();});
document.getElementById('switchToLogin').addEventListener('click', (e)=>{e.preventDefault();showLogin();});

loginForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  showToast('Logged in successfully');
  setTimeout(()=>window.location.href='index.html', 900);
});
registerForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  showToast('Account created — welcome to JerseyHub');
  setTimeout(()=>window.location.href='index.html', 900);
});
</script>
</body>
</html>
