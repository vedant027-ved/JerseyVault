<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order | JerseyHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-banner">
  <div class="container">
    <h1>Track Order</h1>
    <div class="crumb"><a href="index.html">Home</a> / <span>Track Order</span></div>
  </div>
</section>

<section class="section">
  <div class="container narrow">
    <form class="form-card" id="trackForm">
      <div class="form-field"><label>Order ID</label><input type="text" id="trackId" placeholder="e.g. JH482913" required></div>
      <div class="form-field"><label>Email or Mobile Number</label><input type="text" id="trackContact" placeholder="Used at checkout" required></div>
      <button type="submit" class="btn btn-primary btn-full">Track Order</button>
    </form>

    <div id="trackResult" style="display:none;margin-top:34px;">
      <div class="form-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <b style="font-family:var(--font-mono);font-size:15px;" id="resultOrderId"></b>
          <span class="hint">Est. delivery: <strong id="resultEta"></strong></span>
        </div>
        <p class="hint" style="margin-bottom:26px;">Shipping to your saved address</p>
        <div class="status-track">
          <div class="status-step done"><div class="status-dot"></div><span>Order Placed</span></div>
          <div class="status-step done"><div class="status-dot"></div><span>Confirmed</span></div>
          <div class="status-step done"><div class="status-dot"></div><span>Shipped</span></div>
          <div class="status-step"><div class="status-dot"></div><span>Out for Delivery</span></div>
          <div class="status-step"><div class="status-dot"></div><span>Delivered</span></div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/jersey.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
mountLayout('Track Order');
document.querySelectorAll('.status-step.done .status-dot').forEach(d => d.innerHTML = ICONS.check);

document.getElementById('trackForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const id = document.getElementById('trackId').value.trim().toUpperCase();
  document.getElementById('resultOrderId').textContent = 'Order ' + id;
  const eta = new Date(Date.now() + 4*86400000);
  document.getElementById('resultEta').textContent = eta.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  document.getElementById('trackResult').style.display = 'block';
  document.getElementById('trackResult').scrollIntoView({behavior:'smooth', block:'start'});
});
</script>
</body>
</html>
