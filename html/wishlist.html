<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Wishlist | JerseyHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-banner">
  <div class="container">
    <h1>Your Wishlist</h1>
    <div class="crumb"><a href="index.html">Home</a> / <span>Wishlist</span></div>
  </div>
</section>

<section class="section tight">
  <div class="container">
    <div class="prod-grid" id="wishGrid"></div>
    <div class="empty-state" id="wishEmpty" style="display:none;">
      <div style="margin-bottom:14px;font-size:40px;color:var(--grey-line);">&#9825;</div>
      <h3 style="font-family:var(--font-body);text-transform:none;margin-bottom:10px;">Your wishlist is empty</h3>
      <p style="margin-bottom:22px;">Tap the heart icon on any jersey to save it here.</p>
      <a href="shop.html" class="btn btn-primary">Browse Jerseys</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/jersey.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
mountLayout('Shop');
function renderWishlist(){
  const ids = getWishlist();
  const grid = document.getElementById('wishGrid');
  const empty = document.getElementById('wishEmpty');
  if(!ids.length){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML = ids.map(id=>findProduct(id)).filter(Boolean).map(p=>productCardHTML(p)).join('');
}
renderWishlist();
document.addEventListener('click', (e)=>{
  if(e.target.closest('.wishlist-btn')) setTimeout(renderWishlist, 50);
});
</script>
</body>
</html>
