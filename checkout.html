<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | JerseyHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-banner">
  <div class="container">
    <h1>Checkout</h1>
    <div class="crumb"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / <span>Checkout</span></div>
  </div>
</section>

<section class="section tight">
  <div class="container" id="checkoutContainer"></div>
</section>

<div id="site-footer"></div>

<script src="js/jersey.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
mountLayout('Shop');
const cart = getCart();
const container = document.getElementById('checkoutContainer');

if(!cart.length){
  container.innerHTML = `
    <div class="empty-state">
      <h3 style="font-family:var(--font-body);text-transform:none;margin-bottom:10px;">Your cart is empty</h3>
      <p style="margin-bottom:22px;">Add some jerseys before checking out.</p>
      <a href="shop.html" class="btn btn-primary">Go to Shop</a>
    </div>`;
} else {
  const subtotal = cartSubtotal();
  const shipping = subtotal >= 2999 ? 0 : 149;
  const total = subtotal + shipping;

  container.innerHTML = `
    <div class="cart-layout">
      <form class="form-card" id="checkoutForm">
        <h3 style="font-size:20px;margin-bottom:20px;font-family:var(--font-body);text-transform:none;">Shipping Details</h3>
        <div class="form-row">
          <div class="form-field"><label>Full Name</label><input type="text" id="fName" required></div>
          <div class="form-field"><label>Mobile Number</label><input type="tel" id="fPhone" pattern="[0-9]{10}" maxlength="10" required></div>
        </div>
        <div class="form-field"><label>Email Address</label><input type="email" id="fEmail" required></div>
        <div class="form-field"><label>Address</label><textarea id="fAddress" rows="3" required></textarea></div>
        <div class="form-row">
          <div class="form-field"><label>City</label><input type="text" id="fCity" required></div>
          <div class="form-field"><label>State</label>
            <select id="fState" required>
              <option value="">Select State</option>
              <option>Maharashtra</option><option>Delhi</option><option>Karnataka</option>
              <option>Tamil Nadu</option><option>Telangana</option><option>West Bengal</option>
              <option>Gujarat</option><option>Uttar Pradesh</option><option>Other</option>
            </select>
          </div>
        </div>
        <div class="form-field"><label>PIN Code</label><input type="text" id="fPin" pattern="[0-9]{6}" maxlength="6" required></div>

        <h3 style="font-size:20px;margin:26px 0 20px;font-family:var(--font-body);text-transform:none;">Payment Method</h3>
        <div class="form-field">
          <label class="filter-opt"><input type="radio" name="pay" value="COD" checked> Cash on Delivery</label>
          <label class="filter-opt"><input type="radio" name="pay" value="UPI"> UPI</label>
          <label class="filter-opt"><input type="radio" name="pay" value="Card"> Credit / Debit Card</label>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:10px;">Place Order — ₹${total.toLocaleString('en-IN')}</button>
      </form>

      <div class="summary-card">
        <h3 style="color:#fff;font-size:18px;margin-bottom:16px;">Order Summary</h3>
        ${cart.map(i => `<div class="summary-row"><span>${i.name} × ${i.qty}</span><span>₹${(i.price*i.qty).toLocaleString('en-IN')}</span></div>`).join('')}
        <div class="summary-row"><span>Shipping</span><span>${shipping===0?'FREE':'₹'+shipping}</span></div>
        <div class="summary-row total"><span>Total</span><span>₹${total.toLocaleString('en-IN')}</span></div>
      </div>
    </div>`;

  document.getElementById('checkoutForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const orderId = 'JH' + Math.floor(100000 + Math.random()*900000);
    localStorage.setItem('jh_last_order', JSON.stringify({
      id: orderId, total, date: new Date().toISOString(), items: cart
    }));
    setCart([]);
    window.location.href = 'order-confirmation.html';
  });
}
</script>
</body>
</html>
