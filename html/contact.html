<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact &amp; Help | JerseyHub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-banner">
  <div class="container">
    <h1>Contact &amp; Help</h1>
    <div class="crumb"><a href="index.html">Home</a> / <span>Contact</span></div>
  </div>
</section>

<section class="section tight">
  <div class="container">
    <div class="info-grid">
      <div class="info-card reveal" id="ic1">
        <div id="icHeadset"></div>
        <div><b style="font-family:var(--font-body);font-size:14.5px;">Call Us</b>
        <p class="hint">+91 98765 43210<br>Mon–Sat, 10am–7pm IST</p></div>
      </div>
      <div class="info-card reveal">
        <div id="icMail"></div>
        <div><b style="font-family:var(--font-body);font-size:14.5px;">Email Us</b>
        <p class="hint">support@jerseyhub.in<br>Reply within 24 hours</p></div>
      </div>
      <div class="info-card reveal">
        <div id="icShield"></div>
        <div><b style="font-family:var(--font-body);font-size:14.5px;">Warehouse</b>
        <p class="hint">Bhiwandi, Maharashtra<br>Shipping pan-India</p></div>
      </div>
    </div>
  </div>
</section>

<section class="section tight">
  <div class="container">
    <div class="pd-layout" style="grid-template-columns:1fr 1fr;">
      <div>
        <span class="eyebrow reveal">Get In Touch</span>
        <h2 class="section-title reveal" style="margin-bottom:20px;">Send Us a Message</h2>
        <form class="form-card reveal" id="contactForm">
          <div class="form-row">
            <div class="form-field"><label>Name</label><input type="text" required></div>
            <div class="form-field"><label>Email</label><input type="email" required></div>
          </div>
          <div class="form-field"><label>Subject</label>
            <select required><option value="">Select a topic</option><option>Order Issue</option><option>Custom Jersey Query</option><option>Returns &amp; Exchange</option><option>Bulk / Team Order</option><option>Other</option></select>
          </div>
          <div class="form-field"><label>Message</label><textarea rows="5" required></textarea></div>
          <button type="submit" class="btn btn-primary btn-full">Send Message</button>
        </form>
      </div>
      <div class="reveal">
        <span class="eyebrow">FAQs</span>
        <h2 class="section-title" style="margin-bottom:20px;">Quick Answers</h2>
        <div id="faqList"></div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/jersey.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
mountLayout('Help & Support');
document.getElementById('icHeadset').innerHTML = ICONS.headset;
document.getElementById('icMail').innerHTML = `<svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:var(--red);fill:none;stroke-width:1.6;"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`;
document.getElementById('icShield').innerHTML = ICONS.shield;

const faqs = [
  ["What sizes do you offer?", "Most jerseys are available from S to XXL for adults and 16–22 for kids. Full size charts are on every product page."],
  ["How long does delivery take?", "Standard orders ship within 24–48 hours and arrive in 3–6 business days across India. Custom jerseys take 5–7 business days."],
  ["Can I customise any jersey?", "Yes — visit the Custom Jersey page to add your name and number to any club, country or blank template."],
  ["What is your return policy?", "We offer a 7-day easy return and size-exchange window from the date of delivery, provided tags are intact."]
];
document.getElementById('faqList').innerHTML = faqs.map(([q,a],i)=>`
  <div style="border-bottom:1px solid var(--grey-line);padding:16px 0;">
    <b style="font-family:var(--font-body);font-size:14px;">${q}</b>
    <p class="hint" style="margin-top:8px;line-height:1.6;">${a}</p>
  </div>`).join('');

document.getElementById('contactForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  showToast('Message sent — our team will reply within 24 hours');
  e.target.reset();
});
</script>
</body>
</html>
